<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 35px;
            font-size: 30px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #facc15;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #1e293b;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .details {
            text-align: left;
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .details p {
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 15px;
        }

        .details p:last-child {
            border-bottom: none;
        }

        .details strong {
            color: #475569;
        }

        .status {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .present {
            background: #dcfce7;
            color: #15803d;
        }

        .absent {
            background: #fee2e2;
            color: #dc2626;
        }

        .card a {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 11px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .card a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 23px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <div class="card">

        <img src="{{ std[6] }}" alt="Student image">

        <h2>{{ std[1] }}</h2>

        <div class="details">
            <p><strong>Student ID:</strong> {{ std[0] }}</p>
            <p><strong>Age:</strong> {{ std[2] }}</p>
            <p><strong>Gender:</strong> {{ std[3] }}</p>
            <p><strong>Marks:</strong> {{ std[4] }}</p>
            <p><strong>Course:</strong> {{ std[5] }}</p>
        </div>

        {% if std[7] %}
            <p class="status present">Present</p>
        {% else %}
            <p class="status absent">Absent</p>
        {% endif %}

        <br>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
