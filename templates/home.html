
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 35px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #f8fafc;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .add-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            color: #334155;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .card img {
            height: 115px;
            width: 115px;
            border-radius: 50%;
            border: 4px solid #2563eb;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #1e293b;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .card p {
            margin: 9px 0;
            font-size: 15px;
            color: #475569;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .buttons a {
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        /* View button */
        .view-btn {
            background: #2563eb;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        /* Delete button */
        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* Update button */
        .update-btn {
            background: #16a34a;
        }

        .update-btn:hover {
            background: #15803d;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            background: #1e293b;
            border-radius: 12px;
            color: #cbd5e1;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .top-bar {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <h1>Student Management</h1>

    <div class="top-bar">
        <h2>All Students</h2>
        <a href="/student/add" class="add-btn">+ Add Student</a>
    </div>

    <div class="container">

        {% for std in stds %}

        <div class="card">

            <img src="{{ std[6] }}" alt="Student image">

            <h2>{{ std[1] }}</h2>

            <p><strong>ID:</strong> {{ std[0] }}</p>
            <p><strong>Age:</strong> {{ std[2] }}</p>
            <p><strong>Gender:</strong> {{ std[3] }}</p>
            <p><strong>Marks:</strong> {{ std[4] }}</p>
            <p><strong>Course:</strong> {{ std[5] }}</p>

            <div class="buttons">

                <a href="/student/{{ std[0] }}" class="view-btn">
                    View
                </a>

                <a href="/student/delete/{{ std[0] }}"
                   class="delete-btn">
                    Delete
                </a>

                <a href="/student/edit/{{ std[0] }}" class="update-btn">
                    Update
                </a>

            </div>

        </div>

        {% else %}

        <div class="empty">
            <h2>No Students Found</h2>
            <p>Please add a student to see the details.</p>
        </div>

        {% endfor %}

    </div>

</body>
</html>
